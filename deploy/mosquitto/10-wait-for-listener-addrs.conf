# systemd drop-in for mosquitto.service
# (/etc/systemd/system/mosquitto.service.d/10-wait-for-listener-addrs.conf)
#
# uii.conf binds a listener to a specific address (the instrument LAN). At boot
# mosquitto started before NetworkManager had assigned it and failed twice
# before the restart loop saved it. Wait for network-online, then for every
# non-loopback listener address in uii.conf to exist (30 s cap, never blocks
# the boot).
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
ExecStartPre=/opt/uii/deploy/mosquitto/wait-for-listener-addrs.sh /etc/mosquitto/conf.d/uii.conf
